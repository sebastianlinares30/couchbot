<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>couchbot - Sign Up</title>
    <link rel="stylesheet" href="/static/css/sign-up.css">
</head>
<body>
    <a href="/login" class="back-link">Back</a>

    <main id="sign-up">
        <form class="sign-up-form">
            <div class="sign-up-fields">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name">
            </div>

            <div class="sign-up-fields">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name">
            </div>

            <div class="sign-up-fields">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>
            

            <div class="sign-up-fields">
                <label for="confirm-email">Confirm Email</label>
                <input type="email" id="confirm-email" name="confirm-email">
            </div>

            <button type="submit" id="register-button">Register</button>
        </form>
    </main>

    <script src="/static/js/sign-up.js"></script>

</body>
</html>
